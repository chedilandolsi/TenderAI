name: CI/CD Pipeline - TenderAI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build-backend:
    name: Backend CI (Spring Boot & Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test Backend
        working-directory: ./backend
        run: |
          mvn clean test package -DskipTests=false

      - name: Upload Backend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tenderai-backend-jar
          path: backend/target/*.jar

  test-and-build-frontend:
    name: Frontend CI (Angular & Tailwind)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Production Frontend
        working-directory: ./frontend
        run: npm run build -- --configuration production

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tenderai-frontend-dist
          path: frontend/dist/

  deploy-to-render:
    name: Deploy Backend to Render
    needs: [test-and-build-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Backend Deploy Hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "Render deploy triggered successfully."
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not configured. Skipping webhook trigger."
          fi

  deploy-to-vercel:
    name: Deploy Frontend to Vercel
    needs: [test-and-build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./frontend
        continue-on-error: true
