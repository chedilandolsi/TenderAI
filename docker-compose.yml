version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tenderai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tenderai
      POSTGRES_USER: tenderai
      POSTGRES_PASSWORD: tenderai_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderai -d tenderai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tenderai-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tenderai
      SPRING_DATASOURCE_USERNAME: tenderai
      SPRING_DATASOURCE_PASSWORD: tenderai_secret
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: TenderAIExecutiveSecretKeyMustBeAtLeast256BitsLongForHmacSha256SecurityValidation2026
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FRONTEND_URL: http://localhost:4200
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:3000,http://localhost:80

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tenderai-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
